<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareOnboardConnect — Connecting care, careers, commerce and community</title>
<meta name="description" content="CareOnboardConnect is the healthcare ecosystem app for individuals, healthcare professionals and organisations: network, jobs, telehealth, health records, a marketplace and Cowry rewards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>
  // Theme before first paint, so there's no light flash in dark mode: saved choice, else the OS setting.
  (function () {
    var t = null;
    try { t = localStorage.getItem('cc-theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
  // Set before first paint so the hero starts hidden and the intro animation has no flash.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('js-motion');
</script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#00b4b8">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
